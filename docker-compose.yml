name: aistudio2api

services:
  aistudio2api:
    build:
      context: .
      dockerfile: Dockerfile
    image: aistudio2api:latest
    container_name: aistudio2api
    restart: unless-stopped
    ports:
      - "2048:2048"
    volumes:
      - ./auth:/app/auth
      - ./runtime:/app/runtime
      - ./.env:/app/.env
    environment:
      - TZ=Asia/Shanghai
