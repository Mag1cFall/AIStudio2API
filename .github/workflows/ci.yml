name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Check web
        working-directory: web
        run: |
          npm run lint
          npm run format:check
          npm run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test Go
        run: go test ./cmd/... ./internal/...

      - name: Vet Go
        run: go vet ./cmd/... ./internal/...

      - name: Build service
        run: go build -o "$RUNNER_TEMP/aistudio2api" ./cmd/aistudio2api
