name: Build And Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check And Build Frontend
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run build
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run Unit Tests
        run: go test -mod=readonly ./cmd/... ./internal/...
      - name: Check Minimum Go Version
        run: |
          go version
          go vet ./...
          GOOS=windows go vet -tags desktop,production ./...
          go build -mod=readonly ./cmd/aistudio2api
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Build Packages
        shell: bash
        run: |
          version="${GITHUB_SHA:0:7}"
          number=0.0.0
          link=""
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then version="$GITHUB_REF_NAME"; number="${version#v}"; link="-X github.com/Mag1cFall/AIStudio2API/internal/app.version=$version"; fi
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            goos="${target%/*}" goarch="${target#*/}"
            name="aistudio2api-${version}-${goos}-${goarch}"
            mkdir -p "dist/$name"
            GOOS="$goos" GOARCH="$goarch" go build -mod=readonly -trimpath -ldflags="-s -w $link" -o "dist/$name/aistudio2api" ./cmd/aistudio2api
            tar -czf "dist/$name.tar.gz" -C dist "$name"
          done
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.29
          jq --arg v "$number" '.fixed.file_version = $v | .info["0000"].ProductVersion = $v' build/windows/info.json > dist/info.json
          wails3 generate syso -arch amd64 -icon build/windows/icon.ico -manifest build/windows/wails.exe.manifest -info dist/info.json -out cmd/aistudio2api/rsrc_windows_amd64.syso
          name="aistudio2api-${version}-windows-amd64"
          mkdir -p "dist/$name"
          GOOS=windows GOARCH=amd64 go build -mod=readonly -trimpath -tags desktop,production -ldflags="-s -w -H windowsgui $link" -o "dist/$name/aistudio2api.exe" ./cmd/aistudio2api
          (cd dist && zip -qr "$name.zip" "$name")
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            dist/*.zip
            dist/*.tar.gz
          retention-days: 7

  desktop-macos:
    runs-on: macos-15
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build Frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - name: Build App
        shell: bash
        env:
          CGO_ENABLED: '1'
          MACOSX_DEPLOYMENT_TARGET: '12.0'
          CGO_CFLAGS: -mmacosx-version-min=12.0
          CGO_LDFLAGS: -mmacosx-version-min=12.0
        run: |
          version="${GITHUB_SHA:0:7}"
          number=0.0.0
          link=""
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then version="$GITHUB_REF_NAME"; number="${version#v}"; link="-X github.com/Mag1cFall/AIStudio2API/internal/app.version=$version"; fi
          mkdir -p dist
          for arch in arm64 amd64; do
            GOARCH="$arch" go build -mod=readonly -trimpath -tags desktop,production -ldflags="-s -w $link" -o "dist/aistudio2api-$arch" ./cmd/aistudio2api
          done
          app=dist/AIStudio2API.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/aistudio2api" dist/aistudio2api-arm64 dist/aistudio2api-amd64
          cp build/darwin/icons.icns "$app/Contents/Resources/"
          cp build/darwin/Info.plist "$app/Contents/"
          plutil -replace CFBundleShortVersionString -string "$number" "$app/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "$number" "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          ditto -c -k --keepParent "$app" "dist/aistudio2api-${version}-darwin-universal.zip"
          mkdir dist/dmg
          cp -R "$app" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname AIStudio2API -srcfolder dist/dmg -ov -format UDZO "dist/aistudio2api-${version}-darwin-universal.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-macos
          path: |
            dist/*.zip
            dist/*.dmg
          retention-days: 7

  desktop-linux:
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build Frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config file libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Build Packages
        shell: bash
        run: |
          version="${GITHUB_SHA:0:7}"
          number=0.0.0
          link=""
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then version="$GITHUB_REF_NAME"; number="${version#v}"; link="-X github.com/Mag1cFall/AIStudio2API/internal/app.version=$version"; fi
          mkdir -p bin dist
          CGO_ENABLED=1 go build -mod=readonly -trimpath -tags desktop,production -ldflags="-s -w $link" -o bin/aistudio2api ./cmd/aistudio2api
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.29
          cp build/appicon.png dist/aistudio2api.png
          wails3 generate appimage -binary bin/aistudio2api -icon dist/aistudio2api.png -desktopfile build/linux/aistudio2api.desktop -outputdir dist -builddir dist/appimage
          mv dist/aistudio2api-x86_64.AppImage "dist/aistudio2api-${version}-linux-amd64.AppImage"
          VERSION="$number" GOARCH=amd64 wails3 tool package -name aistudio2api -format deb -config build/linux/nfpm.yaml -out dist
          mv dist/aistudio2api*.deb "dist/aistudio2api-${version}-linux-amd64.deb"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-linux
          path: |
            dist/*.AppImage
            dist/*.deb
          retention-days: 7

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build, desktop-macos, desktop-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "$RELEASE_TAG" "${flags[@]}"

  docker:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=semver,pattern={{raw}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
